[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pflow-tools"
version = "0.1.0"
description = "Tools for cluster regression analysis and visualization"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "pflow-tools contributors"}
]
dependencies = [
    "numpy>=1.24.0,<3.0.0",
    "awkward>=2.0.0",
    "PyYAML>=6.0",
    "matplotlib>=3.5.0",
    "hist>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
]

[project.scripts]
h5-prep = "utils.h5_prep:main"

[tool.setuptools]
packages = ["pflow_tools"]

[tool.setuptools.package-dir]
pflow_tools = "tools"

[tool.setuptools.package-data]
pflow_tools = ["py.typed"]